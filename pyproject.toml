[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphs_bbaaset"
version = "0.1.0"
description = "A Python library implementing Dijkstra's shortest path algorithm"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Abdalbaset Taher", email = "ataher@msudenver.edu" }
]

[tool.setuptools.packages.find]
where = ["src"]